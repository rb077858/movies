<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamVault</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Heebo',sans-serif;

    background:
    radial-gradient(circle at top right,#2563eb 0%,transparent 30%),
    radial-gradient(circle at bottom left,#7c3aed 0%,transparent 30%),
    #020617;

    min-height:100vh;
    color:white;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:25px 20px 80px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-icon{
    font-size:38px;
}

.brand-name{
    font-size:28px;
    font-weight:900;

    background:linear-gradient(to left,#60a5fa,#c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.support-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);

    color:white;
    padding:12px 20px;

    border-radius:16px;

    cursor:pointer;
    transition:0.3s;

    font-size:16px;
    font-weight:700;
}

.support-btn:hover{
    transform:translateY(-2px);
    border-color:#60a5fa;
    box-shadow:0 0 20px rgba(96,165,250,0.2);
}

.hero{
    text-align:center;
    padding-top:40px;
    animation:fadeUp 1s ease;
}

.hero-icon{
    font-size:70px;
    margin-bottom:12px;
}

.hero h1{
    font-size:62px;
    font-weight:900;

    background:linear-gradient(to left,#60a5fa,#c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    margin-top:10px;
    color:#cbd5e1;
    font-size:20px;
}

.search-wrapper{
    max-width:760px;
    margin:55px auto;
    position:relative;
}

.search-input{
    width:100%;

    padding:22px 70px 22px 25px;

    border-radius:30px;
    border:2px solid rgba(255,255,255,0.08);

    background:rgba(255,255,255,0.07);
    backdrop-filter:blur(15px);

    color:white;
    font-size:20px;

    outline:none;
    transition:0.3s;
}

.search-input:focus{
    border-color:#60a5fa;
    box-shadow:0 0 30px rgba(96,165,250,0.25);
}

.search-input::placeholder{
    color:#94a3b8;
}

.search-icon{
    position:absolute;
    right:24px;
    top:50%;
    transform:translateY(-50%);
    font-size:28px;
}

.results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:24px;
}

.card{
    background:rgba(255,255,255,0.07);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:30px;

    padding:24px;

    backdrop-filter:blur(14px);

    transition:0.35s;

    animation:fadeUp 0.5s ease;
}

.card:hover{
    transform:translateY(-7px) scale(1.02);

    border-color:#60a5fa;

    box-shadow:0 0 35px rgba(96,165,250,0.25);
}

.movie-title{
    font-size:28px;
    font-weight:800;

    line-height:1.3;

    margin-bottom:20px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.link-btn{
    text-decoration:none;

    background:linear-gradient(135deg,#2563eb,#7c3aed);

    color:white;

    padding:14px 18px;

    border-radius:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-weight:700;

    transition:0.25s;
}

.link-btn:hover{
    transform:translateX(-4px);
    filter:brightness(1.1);
}

.loading,
.no-results{
    text-align:center;
    margin-top:40px;
    color:#cbd5e1;
    font-size:22px;
}

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.6);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:92%;
    max-width:500px;

    background:#0f172a;

    border:1px solid rgba(255,255,255,0.08);

    border-radius:28px;

    padding:28px;

    animation:fadeUp 0.3s ease;
}

.modal-title{
    font-size:30px;
    font-weight:900;
    margin-bottom:10px;
}

.modal-desc{
    color:#cbd5e1;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group input,
.form-group textarea{

    width:100%;

    background:rgba(255,255,255,0.07);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:16px;

    padding:15px;

    color:white;

    font-size:16px;

    outline:none;
}

.form-group textarea{
    min-height:140px;
    resize:vertical;
}

.send-btn{
    width:100%;

    background:linear-gradient(135deg,#2563eb,#7c3aed);

    border:none;

    color:white;

    padding:16px;

    border-radius:18px;

    font-size:18px;
    font-weight:800;

    cursor:pointer;

    transition:0.3s;
}

.send-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
}

.close-btn{
    margin-top:15px;

    width:100%;

    background:transparent;

    border:1px solid rgba(255,255,255,0.1);

    color:white;

    padding:14px;

    border-radius:16px;

    cursor:pointer;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@media(max-width:700px){

    .topbar{
        flex-direction:column;
        gap:20px;
    }

    .hero h1{
        font-size:44px;
    }

    .hero-icon{
        font-size:54px;
    }

    .search-input{
        font-size:18px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="topbar">

        <div class="brand">
            <div class="brand-icon">🎬</div>
            <div class="brand-name">StreamVault</div>
        </div>

        <button class="support-btn" onclick="openModal()">
            💬 תמיכה ובקשות
        </button>

    </div>

    <div class="hero">

        <div class="hero-icon">🍿</div>

        <h1>
            סרטים וסדרות ללא הגבלה
        </h1>

        <p>
            חיפוש מהיר במאגר הסרטים והסדרות
        </p>

    </div>

    <div class="search-wrapper">

        <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="חפש סרט, סדרה או אוסף סרטים..."
        >

        <div class="search-icon">🔍</div>

    </div>

    <div id="results" class="results"></div>

</div>

<div class="modal" id="supportModal">

    <div class="modal-box">

        <div class="modal-title">
            💬 תמיכה ובקשות
        </div>

        <div class="modal-desc">
            מצאת בעיה באתר? רוצה לבקש סרט או סדרה חדשים?
        </div>

        <form
            action="https://formsubmit.co/rb077858@gmail.com"
            method="POST"
        >

            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <div class="form-group">
                <input
                    type="text"
                    name="name"
                    placeholder="השם שלך"
                    required
                >
            </div>

            <div class="form-group">
                <input
                    type="email"
                    name="email"
                    placeholder="אימייל לחזרה"
                >
            </div>

            <div class="form-group">
                <textarea
                    name="message"
                    placeholder="כתוב כאן את הבקשה או הבעיה..."
                    required
                ></textarea>
            </div>

            <button class="send-btn" type="submit">
                🚀 שלח
            </button>

        </form>

        <button class="close-btn" onclick="closeModal()">
            סגור
        </button>

    </div>

</div>

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1cHeZpE0ibNRWC2onWo3Tx2wPieWjM75GJa49vpmtxX0/export?format=csv";

let movies = [];

const results = document.getElementById("results");

function renderMovies(list){

    if(list.length === 0){

        results.innerHTML = `
            <div class="no-results">
                😢 לא נמצאו תוצאות
            </div>
        `;

        return;
    }

    results.innerHTML = list.map(movie => `

        <div class="card">

            <div class="movie-title">
                🎞️ ${movie.title}
            </div>

            <div class="links">

                ${movie.links.map(link => `

                    <a
                        href="${link.url}"
                        target="_blank"
                        class="link-btn"
                    >

                        <span>${link.name}</span>

                        <span>▶</span>

                    </a>

                `).join("")}

            </div>

        </div>

    `).join("");

}

function parseMovies(data){

    movies = data
    .filter(row => row[0])
    .map(row => {

        const links = [];

        for(let i = 1; i < row.length; i += 2){

            if(row[i] && row[i+1]){

                links.push({
                    name: row[i],
                    url: row[i+1]
                });

            }

        }

        return{
            title: row[0],
            links
        };

    });

    renderMovies(movies);

}

results.innerHTML = `
    <div class="loading">
        ⏳ טוען מאגר...
    </div>
`;

Papa.parse(SHEET_URL,{

    download:true,

    complete:function(res){

        parseMovies(res.data);

    },

    error:function(){

        results.innerHTML = `
            <div class="no-results">
                ❌ שגיאה בטעינת המאגר
            </div>
        `;

    }

});

document
.getElementById("searchInput")
.addEventListener("input",function(){

    const value = this.value
    .trim()
    .toLowerCase();

    const filtered = movies.filter(movie =>
        movie.title
        .toLowerCase()
        .includes(value)
    );

    renderMovies(filtered);

});

function openModal(){

    document
    .getElementById("supportModal")
    .classList
    .add("active");

}

function closeModal(){

    document
    .getElementById("supportModal")
    .classList
    .remove("active");

}

window.addEventListener("click",function(e){

    const modal =
    document.getElementById("supportModal");

    if(e.target === modal){

        closeModal();

    }

});

</script>

</body>
</html>
