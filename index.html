<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MovieVault</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Heebo',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top right,#1e293b 0%,#020617 40%),
    linear-gradient(135deg,#0f172a,#111827);
    overflow-x:hidden;
    color:white;
}

.bg-glow{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:#2563eb55;
    filter:blur(120px);
    top:-150px;
    right:-150px;
    z-index:-1;
}

.bg-glow2{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    background:#7c3aed55;
    filter:blur(120px);
    bottom:-120px;
    left:-120px;
    z-index:-1;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:40px 20px 80px;
}

.hero{
    text-align:center;
    margin-top:70px;
    animation:fadeIn 1s ease;
}

.logo{
    font-size:64px;
    margin-bottom:12px;
}

.hero h1{
    font-size:52px;
    font-weight:900;
    background:linear-gradient(to left,#60a5fa,#c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    color:#cbd5e1;
    margin-top:10px;
    font-size:18px;
}

.search-box{
    margin:50px auto;
    max-width:700px;
    position:relative;
}

.search-box input{
    width:100%;
    padding:22px 70px 22px 28px;
    border:none;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    color:white;
    font-size:20px;
    outline:none;
    transition:0.3s;
    border:2px solid transparent;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
}

.search-box input:focus{
    border-color:#60a5fa;
    transform:scale(1.01);
}

.search-box input::placeholder{
    color:#94a3b8;
}

.search-icon{
    position:absolute;
    right:24px;
    top:50%;
    transform:translateY(-50%);
    font-size:28px;
}

.results{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:25px;
}

.movie-card{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(16px);
    border-radius:28px;
    padding:25px;
    transition:0.35s;
    position:relative;
    overflow:hidden;
    animation:cardAppear .4s ease;
}

.movie-card:hover{
    transform:translateY(-6px) scale(1.02);
    border-color:#60a5fa;
    box-shadow:0 0 35px rgba(96,165,250,0.25);
}

.movie-title{
    font-size:28px;
    font-weight:800;
    margin-bottom:20px;
    line-height:1.3;
}

.links{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.movie-link{
    text-decoration:none;
    color:white;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    padding:14px 18px;
    border-radius:16px;
    transition:0.25s;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.movie-link:hover{
    transform:translateX(-4px);
    filter:brightness(1.1);
}

.movie-link span{
    font-size:18px;
}

.empty{
    text-align:center;
    color:#94a3b8;
    margin-top:30px;
    font-size:20px;
}

.footer{
    margin-top:80px;
    text-align:center;
    color:#64748b;
    font-size:14px;
}

.loading{
    text-align:center;
    padding:40px;
    color:#cbd5e1;
    font-size:20px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes cardAppear{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:700px){

    .hero h1{
        font-size:38px;
    }

    .logo{
        font-size:48px;
    }

    .search-box input{
        font-size:18px;
        padding:18px 60px 18px 22px;
    }

    .results{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<div class="container">

    <div class="hero">
        <div class="logo">🎬</div>
        <h1>MovieVault</h1>
        <p>חיפוש מהיר במאגר הסרטים שלך</p>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="חפש סרט או סדרה..." />
        <div class="search-icon">🔍</div>
    </div>

    <div id="results" class="results"></div>

    <div class="footer">
        נבנה עם GitHub Pages 🚀
    </div>

</div>

<script>
// ===============================
// שים כאן את קישור ה־CSV של Google Sheets
// ===============================

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1cHeZpE0ibNRWC2onWo3Tx2wPieWjM75GJa49vpmtxX0/edit?usp=drivesdk";

let movies = [];

async function loadMovies() {

    const results = document.getElementById("results");

    results.innerHTML = `
        <div class="loading">
            טוען סרטים...
        </div>
    `;

    try{

        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();

        const rows = csvText.split("\n").slice(1);

        movies = rows
        .map(row => row.split(","))
        .filter(row => row[0])
        .map(row => {

            return {
                title: row[0]?.replace(/"/g,'').trim(),

                links: [
                    {
                        name: row[1]?.replace(/"/g,'').trim(),
                        url: row[2]?.replace(/"/g,'').trim()
                    },
                    {
                        name: row[3]?.replace(/"/g,'').trim(),
                        url: row[4]?.replace(/"/g,'').trim()
                    },
                    {
                        name: row[5]?.replace(/"/g,'').trim(),
                        url: row[6]?.replace(/"/g,'').trim()
                    }
                ].filter(link => link.name && link.url)

            };

        });

        renderMovies(movies);

    }catch(err){

        results.innerHTML = `
            <div class="empty">
                ❌ שגיאה בטעינת הגיליון
            </div>
        `;

        console.error(err);
    }
}

function renderMovies(movieList){

    const results = document.getElementById("results");

    if(movieList.length === 0){

        results.innerHTML = `
            <div class="empty">
                😢 לא נמצאו סרטים
            </div>
        `;

        return;
    }

    results.innerHTML = movieList.map(movie => `

        <div class="movie-card">

            <div class="movie-title">
                🎞️ ${movie.title}
            </div>

            <div class="links">

                ${movie.links.map(link => `

                    <a class="movie-link"
                       href="${link.url}"
                       target="_blank">

                        <span>${link.name}</span>

                        <span>▶</span>

                    </a>

                `).join("")}

            </div>

        </div>

    `).join("");
}

document.getElementById("searchInput")
.addEventListener("input", e => {

    const value = e.target.value.trim().toLowerCase();

    const filtered = movies.filter(movie =>
        movie.title.toLowerCase().includes(value)
    );

    renderMovies(filtered);
});

loadMovies();
</script>

</body>
</html>
