<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Search</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Heebo',sans-serif;
    background:
    radial-gradient(circle at top right,#1d4ed8 0%,transparent 30%),
    radial-gradient(circle at bottom left,#7c3aed 0%,transparent 30%),
    #020617;

    min-height:100vh;
    color:white;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:30px 20px 80px;
}

.hero{
    text-align:center;
    padding-top:70px;
    animation:fadeUp 1s ease;
}

.hero-icon{
    font-size:70px;
    margin-bottom:10px;
}

.hero h1{
    font-size:60px;
    font-weight:900;

    background:linear-gradient(to left,#60a5fa,#c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    margin-top:10px;
    color:#cbd5e1;
    font-size:20px;
}

.search-wrapper{
    max-width:750px;
    margin:50px auto;
    position:relative;
}

.search-input{
    width:100%;
    padding:22px 70px 22px 25px;

    border-radius:28px;
    border:2px solid rgba(255,255,255,0.08);

    background:rgba(255,255,255,0.07);
    backdrop-filter:blur(14px);

    color:white;
    font-size:20px;
    outline:none;

    transition:0.3s;
}

.search-input:focus{
    border-color:#60a5fa;
    box-shadow:0 0 30px rgba(96,165,250,0.25);
}

.search-input::placeholder{
    color:#94a3b8;
}

.search-icon{
    position:absolute;
    top:50%;
    right:24px;
    transform:translateY(-50%);
    font-size:28px;
}

.results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:24px;
    margin-top:20px;
}

.card{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.08);

    border-radius:28px;
    padding:24px;

    backdrop-filter:blur(12px);

    transition:0.35s;
    animation:fadeUp 0.5s ease;
}

.card:hover{
    transform:translateY(-6px) scale(1.02);
    border-color:#60a5fa;
    box-shadow:0 0 35px rgba(96,165,250,0.2);
}

.movie-title{
    font-size:28px;
    font-weight:800;
    margin-bottom:20px;
    line-height:1.3;
}

.links{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.link-btn{
    text-decoration:none;

    background:linear-gradient(135deg,#2563eb,#7c3aed);

    padding:14px 18px;
    border-radius:18px;

    color:white;
    font-weight:700;

    display:flex;
    justify-content:space-between;
    align-items:center;

    transition:0.25s;
}

.link-btn:hover{
    transform:translateX(-4px);
    filter:brightness(1.1);
}

.loading,
.no-results{
    text-align:center;
    margin-top:40px;
    color:#cbd5e1;
    font-size:22px;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:700px){

    .hero h1{
        font-size:42px;
    }

    .hero-icon{
        font-size:54px;
    }

    .search-input{
        font-size:18px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="hero">
        <div class="hero-icon">🎬</div>

        <h1>MovieVault</h1>

        <p>
            חיפוש מהיר במאגר הסרטים
        </p>
    </div>

    <div class="search-wrapper">

        <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="חפש סרט או סדרה..."
        >

        <div class="search-icon">🔍</div>

    </div>

    <div id="results" class="results"></div>

</div>

<script>

// =============================
// קישור CSV אמיתי
// =============================

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1cHeZpE0ibNRWC2onWo3Tx2wPieWjM75GJa49vpmtxX0/export?format=csv";

let movies = [];

const results = document.getElementById("results");

function renderMovies(list){

    if(list.length === 0){

        results.innerHTML = `
            <div class="no-results">
                😢 לא נמצאו סרטים
            </div>
        `;

        return;
    }

    results.innerHTML = list.map(movie => `

        <div class="card">

            <div class="movie-title">
                🎞️ ${movie.title}
            </div>

            <div class="links">

                ${movie.links.map(link => `

                    <a
                        href="${link.url}"
                        target="_blank"
                        class="link-btn"
                    >

                        <span>${link.name}</span>

                        <span>▶</span>

                    </a>

                `).join("")}

            </div>

        </div>

    `).join("");

}

function parseMovies(data){

    movies = data
    .filter(row => row[0])
    .map(row => {

        const links = [];

        for(let i = 1; i < row.length; i += 2){

            if(row[i] && row[i+1]){

                links.push({
                    name: row[i],
                    url: row[i+1]
                });

            }

        }

        return{
            title: row[0],
            links
        };

    });

    renderMovies(movies);

}

results.innerHTML = `
    <div class="loading">
        טוען סרטים...
    </div>
`;

Papa.parse(SHEET_URL,{

    download:true,

    complete:function(res){

        parseMovies(res.data);

    },

    error:function(){

        results.innerHTML = `
            <div class="no-results">
                ❌ שגיאה בטעינת הגיליון
            </div>
        `;

    }

});

document
.getElementById("searchInput")
.addEventListener("input",function(){

    const value = this.value
    .trim()
    .toLowerCase();

    const filtered = movies.filter(movie =>
        movie.title
        .toLowerCase()
        .includes(value)
    );

    renderMovies(filtered);

});

</script>

</body>
</html>
