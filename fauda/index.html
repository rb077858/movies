<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>פאודה עונה 5</title>

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

/* ====== ORIGINAL STYLE (לא נגעתי כמעט) ====== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Heebo',sans-serif;
}

body{
    background:
    radial-gradient(circle at top right,#2563eb 0%,transparent 30%),
    radial-gradient(circle at bottom left,#7c3aed 0%,transparent 30%),
    #020617;

    min-height:100vh;
    color:white;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:25px 20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    gap:10px;
    align-items:center;
}

.brand-icon{font-size:40px;}

.brand-name{
    font-size:28px;
    font-weight:900;
    background:linear-gradient(to left,#60a5fa,#c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ====== SMALL SUPPORT BUTTON (תיקון חשוב) ====== */

.top-btn{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    padding:8px 14px;
    border-radius:12px;
    cursor:pointer;
    color:white;
    font-weight:700;
    font-size:14px;
    transition:0.2s;
}

.top-btn:hover{
    border-color:#60a5fa;
    transform:translateY(-2px);
}

/* ====== HERO ====== */

.hero{
    text-align:center;
    margin-top:30px;
}

.hero h1{
    font-size:54px;
    font-weight:900;
    background:linear-gradient(to left,#60a5fa,#c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    color:#cbd5e1;
    margin-top:10px;
}

/* ====== SEARCH ====== */

.search-wrapper{
    max-width:800px;
    margin:40px auto;
    position:relative;
}

.search-input{
    width:100%;
    padding:22px 130px 22px 70px;
    border-radius:28px;
    border:2px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.07);
    color:white;
    font-size:20px;
    outline:none;
}

.search-icon{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    font-size:24px;
}

/* 🧹 FILTER ICON — קטן ומגניב */
.filter-icon{
    position:absolute;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:rgba(255,255,255,0.06);
    cursor:pointer;
    transition:0.2s;
}

.filter-icon:hover{
    transform:translateY(-50%) scale(1.08);
    border:1px solid #60a5fa;
}

/* ====== FILTER PANEL ====== */

.filters{
    display:none;
    max-width:800px;
    margin:20px auto;
    padding:18px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
}

.filters.active{display:block;}

.genre-tag{
    display:inline-block;
    margin:5px;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(255,255,255,0.07);
    cursor:pointer;
    font-size:13px;
}

.genre-tag.active{
    background:#2563eb;
}

/* ====== CARDS (נשאר כמו שהיה יפה) ====== */

.results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:rgba(255,255,255,0.07);
    border-radius:20px;
    padding:20px;
}

.title{
    font-size:24px;
    font-weight:900;
}

.badge{
    display:inline-block;
    margin:4px 4px 0 0;
    padding:5px 10px;
    background:rgba(255,255,255,0.08);
    border-radius:999px;
    font-size:12px;
}

.desc{
    color:#cbd5e1;
    margin-top:8px;
    font-size:14px;
}

.link{
    display:block;
    margin-top:8px;
    padding:10px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    border-radius:12px;
    text-decoration:none;
    color:white;
    font-weight:700;
}

/* ====== MODAL ====== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal.active{display:flex;}

.box{
    background:#0f172a;
    padding:20px;
    border-radius:20px;
    width:90%;
    max-width:450px;
}

input,textarea{
    width:100%;
    margin:8px 0;
    padding:10px;
    border-radius:10px;
    border:none;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    font-weight:800;
}

</style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <div class="brand">
            <div class="brand-icon">🎬</div>
            <div class="brand-name">StreamVault</div>
        </div>

        <button class="top-btn" onclick="openModal()">💬 תמיכה</button>
    </div>

    <div class="hero">
     </h1>פאודה עונה 5</h1>
        <p>חיפוש מהיר במאגר</p>
    </div>

    <div class="search-wrapper">

        <input id="search" class="search-input" placeholder="חפש סרט או סדרה...">

        <div class="search-icon">🔍</div>

        <div class="filter-icon" onclick="toggleFilters()">🧹</div>

    </div>

    <div id="filters" class="filters"></div>

    <div id="results" class="results"></div>

</div>

<!-- MODAL -->

<div class="modal" id="modal">
    <div class="box">

        <h3>תמיכה</h3>

        <form action="https://formsubmit.co/rb077858@gmail.com" method="POST">
            <input type="hidden" name="_captcha" value="false">

            <input name="name" placeholder="שם" required>
            <input name="email" placeholder="אימייל">
            <textarea name="message" placeholder="הודעה" required></textarea>

            <button type="submit">שלח</button>
        </form>

        <button onclick="closeModal()" style="margin-top:10px;background:#334155">
            סגור
        </button>

    </div>
</div>

<script>

const SHEET =
"https://docs.google.com/spreadsheets/d/1KisaK6kcas31TRUjcAV8psRNLWwbE721CB8_zxdJ4uk/edit?usp=drivesdk";

let data = [];
let selectedGenre = null;

function render(list){

    const el = document.getElementById("results");

    el.innerHTML = list.map(m => `
        <div class="card">

            <div class="title">${m.title}</div>

            <div>
                ${m.genres.map(g=>`<span class="badge">${g}</span>`).join("")}
            </div>

            ${m.year ? `<div class="badge">📅 ${m.year}</div>` : ""}

            ${m.desc ? `<div class="desc">${m.desc}</div>` : ""}

            ${m.links.map(l=>`
                <a class="link" href="${l.url}" target="_blank">${l.name}</a>
            `).join("")}

        </div>
    `).join("");

}

function filter(){

    const q = document.getElementById("search").value.toLowerCase();

    const res = data.filter(m =>
        m.title.toLowerCase().includes(q) &&
        (!selectedGenre || m.genres.includes(selectedGenre))
    );

    render(res);
}

function buildGenres(){

    const set = new Set();

    data.forEach(m => m.genres.forEach(g=>set.add(g)));

    document.getElementById("filters").innerHTML =
    [...set].map(g=>`
        <span class="genre-tag" onclick="selectGenre('${g}',this)">
            ${g}
        </span>
    `).join("");
}

function selectGenre(g,el){
    selectedGenre = g;

    document.querySelectorAll(".genre-tag").forEach(t=>t.classList.remove("active"));
    el.classList.add("active");

    filter();
}

function toggleFilters(){
    document.getElementById("filters").classList.toggle("active");
}

function openModal(){
    document.getElementById("modal").classList.add("active");
}

function closeModal(){
    document.getElementById("modal").classList.remove("active");
}

document.getElementById("search").addEventListener("input",filter);

Papa.parse(SHEET,{
    download:true,
    complete:(res)=>{

        data = res.data.filter(r=>r[0]).map(r=>({

            title:r[0],
            genres:(r[1]||"").split(",").map(x=>x.trim()).filter(Boolean),
            year:r[2],
            desc:r[3],
            links:[]
        }));

        for(let i=4;i<res.data[0].length;i+=2){
            data.forEach((m,idx)=>{
                if(res.data[idx] && res.data[idx][i]){
                    m.links.push({
                        name:res.data[idx][i],
                        url:res.data[idx][i+1]
                    });
                }
            });
        }

        buildGenres();
        render(data);
    }
});

</script>

</body>
      </html>
